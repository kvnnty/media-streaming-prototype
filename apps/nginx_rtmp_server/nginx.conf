worker_processes  auto;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # HLS config
            hls on;
            hls_path /hls/live;
            hls_fragment 4s;
            hls_playlist_length 60s;

            # Record streams for VOD
            record all;
            record_path /vod;
            record_unique on;
            record_suffix .mp4;

            # Optional: only allow certain stream keys
            # on_publish http://api_server:5000/validate-stream
        }
    }
}

http {
    server {
        listen 8083;

        # Serve HLS
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /;
            add_header Cache-Control no-cache;
        }

        # Serve VOD recordings
        location /vod {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /;
            add_header Cache-Control no-cache;
        }
    }
}
