worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # HLS config
            hls on;
            hls_path /hls;
            hls_fragment 4s;
            hls_playlist_length 60s;

            # Record streams for VOD
            record all;
            record_path /vod;
            record_unique on;
            record_suffix .mp4;

            # Allow all publishers (remove 440)
            allow publish all;
            allow play all;

            # Hooks for stream status updates
            on_publish http://api:5000/api/streams/start;
            on_publish_done http://api:5000/api/streams/end;
        }
    }
}

http {
    server {
        listen 8083;

        # Serve HLS
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods GET,OPTIONS;
            add_header Access-Control-Allow-Headers *;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Serve VOD
        location /vod {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods GET,OPTIONS;
            add_header Access-Control-Allow-Headers *;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}
