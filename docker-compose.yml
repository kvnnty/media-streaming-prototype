services:
  db:
    image: postgres:17
    container_name: media_streaming_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure@123
      POSTGRES_DB: media_streaming_demo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  api_service:
    build:
      context: ./apps/api_server
      dockerfile: Dockerfile
    container_name: api_server
    env_file:
      - ./apps/api_server/.env
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  web_service:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: web_server
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:3000"
    depends_on:
      - api_service
      - nginx_rtmp_service
    restart: unless-stopped

  nginx_rtmp_service:
    build:
      context: ./apps/nginx_rtmp_server
      dockerfile: Dockerfile
    container_name: nginx_rtmp_server
    ports:
      - "1935:1935"
      - "8083:8083"
    volumes:
      - ./apps/nginx_rtmp_server/hls:/hls
      - ./apps/nginx_rtmp_server/vod:/vod
      - ./apps/nginx_rtmp_server/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pg_data:
